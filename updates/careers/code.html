              <div class="flex items-center justify-between pb-1.5 border-b border-slate-100">
                <span class="font-code-telemetry text-[10px] font-bold uppercase text-slate-500 tracking-wider">CORE SKILLS &amp; STACK</span>
                <span class="font-code-telemetry text-[10px] text-blue-600 font-semibold">Verified Prereq</span>
              </div>
              <div class="flex flex-wrap gap-1.5 mt-2">
                ${data.skills.map(skill => `<span class="px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-code-telemetry text-[11px] font-semibold border border-blue-200/80">${skill}</span>`).join('')}
              </div>
            </div>
          `
        }
      ];

      // Keep shards contained within viewport boundaries if bar is near edges
      let anchorX = barCenterX;
      const minX = 180;
      const maxX = stageWidth - 180;
      if (anchorX < minX) anchorX = minX;
      if (anchorX > maxX) anchorX = maxX;

      let anchorY = barCenterY - 10;
      if (anchorY < 210) anchorY = 210;
      if (anchorY > stageHeight - 140) anchorY = stageHeight - 140;

      // Spawn initial assembled elements right at bar center
      shardsData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'shard-piece assembled';
        div.style.left = `${anchorX}px`;
        div.style.top = `${anchorY}px`;
        div.style.width = `${item.width}px`;
        div.innerHTML = item.html;
        fracturedContainer.appendChild(div);

        // Slight micro delay before fracturing outwards
        requestAnimationFrame(() => {
          setTimeout(() => {
            div.classList.remove('assembled');
            div.style.transform = `translate(${item.offsetX}px, ${item.offsetY}px) rotate(${item.tilt}deg)`;
            div.style.opacity = '1';
          }, 40);
        });
      });

      // Show Reset pill at top-right
      setTimeout(() => {
        resetPill.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-1');
        resetPill.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
      }, 150);
    }

    // Attach click events on each bar
    roleBars.forEach(bar => {
      bar.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isZoomed && bar.getAttribute('data-role') === activeRoleKey) {
          resetZoomAndReassemble();
        } else {
          if (isZoomed) {
            resetZoomAndReassemble();
            setTimeout(() => zoomAndFractureBar(bar), 300);
          } else {
            zoomAndFractureBar(bar);
          }
        }
      });
    });

    // Reset button click
    resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetZoomAndReassemble();
    });

    // Keyboard ESC key to reset
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isZoomed) {
        resetZoomAndReassemble();
      }
    });

    // Click outside on stage also resets smoothly
    stage.addEventListener('click', (e) => {
      if (isZoomed && !e.target.closest('.shard-piece') && !e.target.closest('.role-bar')) {
        resetZoomAndReassemble();
      }
    });

  })();
</script>


</body></html>
